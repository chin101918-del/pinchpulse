<script>
DC.define("WatchUI", {"view": "live", "value": "102", "count": "4", "activity": "Counting", "time": "12:55", "h24": "0"}, function (DCLogic) {

class Component extends DCLogic {
  renderVals() {
    var P = this.props;
    var view = P.view || 'live';
    var idle = view === 'idle';
    var isList = view === 'species' || view === 'history';
    var B = '/assets/';
    var speciesRows = [
      { name: 'Dog', src: B + 'c41f37ce9978f69fe0ec6c948e797e16', selected: true },
      { name: 'Cat', src: B + '0c932cc1a1d2333b6d5c47a971d19fb2', selected: false },
      { name: 'Human', src: B + 'e85bc5fe4de3975c2e50ba093d4a7762', selected: false }
    ];
    var HEART = B + '773846be9f32c64a1cddf5a673c221c8', LUNG = B + '5d17dd0a7a5ce27bec4ecf2e2afc98c1';
    // history times trail the live clock so the list always reads as "just now"
    var ago = function (mins) {
      var m = /^(\d{1,2}):(\d{2})$/.exec(String(P.time || '12:55'));
      if (!m) return P.time || '';
      var h24 = String(P.h24) === '1';
      var t = (+m[1]) * 60 + (+m[2]);
      if (!h24 && +m[1] === 12) t = 12 * 60 + (+m[2]);
      t = ((t - mins) % 1440 + 1440) % 1440;
      var hh = Math.floor(t / 60), mm = t % 60;
      if (!h24) { hh = hh % 12; if (hh === 0) hh = 12; }
      return (h24 && hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    };
    var historyRows = [
      { icon: LUNG, value: '72', unit: 'br/min', time: ago(1), status: 'Tachypnea', color: '#FF5A4E', bar: '22%' },
      { icon: HEART, value: '99', unit: 'bpm', time: ago(4), status: 'Normal', color: '#4CDA95', bar: '25%' },
      { icon: HEART, value: '128', unit: 'bpm', time: ago(33), status: 'Normal', color: '#4CDA95', bar: '40%' }
    ];
    var value = (P.value === undefined || P.value === null) ? '102' : String(P.value);
    var hasValue = !idle && value !== '';
    var v = parseFloat(value);
    var lo = 60, hi = 140;
    var status = (!hasValue || isNaN(v)) ? null : (v > hi ? 'tachy' : (v < lo ? 'brady' : 'normal'));
    var COLORS = { normal: '#4CDA95', tachy: '#FF6B57', brady: '#4FA6E9' };
    var LABELS = { normal: 'Normal', tachy: 'Tachycardia', brady: 'Bradycardia' };
    var pos = 0.5;
    if (status) {
      pos = 0.36 + (v - lo) / (hi - lo) * 0.28;
      pos = Math.max(0.02, Math.min(0.98, pos));
    }
    return {
      time: P.time || '12:55',
      isMain: !isList, isList: isList, isSpecies: view === 'species', isHistory: view === 'history',
      listTitle: view === 'species' ? 'Species' : 'History',
      speciesRows: speciesRows, historyRows: historyRows,
      isIdle: idle,
      isLive: !idle,
      hasValue: hasValue,
      noValue: !hasValue,
      value: value,
      statusLabel: status ? LABELS[status] : '',
      statusColor: status ? COLORS[status] : '#4CDA95',
      markerLeft: (pos * 100).toFixed(1) + '%',
      count: String(P.count === undefined || P.count === null ? '4' : P.count),
      activity: P.activity || 'Counting'
    };
  }
}

return Component;
});
</script>
<script>
DC.define("iPhoneUI", {"value": 78, "count": 6, "time": "9:41"}, function (DCLogic) {

class Component extends DCLogic {
  renderVals() {
    var P = this.props;
    var GREEN = '#4DDB94', HIGH = '#FF6B57', LOW = '#4FA6E8';
    var lo = 0, hi = 200, bandLo = 60, bandHi = 140;
    var count = Math.round(Number(P.count === undefined ? 6 : P.count) || 0);
    var raw = Number(P.value);
    var v = (count >= 2 && isFinite(raw) && raw > 0) ? Math.round(raw) : null;
    var frac = function (x) { return Math.max(0.02, Math.min(0.98, (x - lo) / (hi - lo))); };
    var rad = function (f) { return (135 + f * 270) * Math.PI / 180; };
    var fLo = frac(bandLo), fHi = frac(bandHi), fm = v === null ? 0 : frac(v);
    var status = v === null ? null : (v < bandLo ? 'low' : (v > bandHi ? 'high' : 'normal'));
    var C = 160, R = 136, LR = 156;
    return {
      time: P.time || '9:41',
      greenDash: ((fHi - fLo) * 75) + ' 100',
      greenOff: String(-fLo * 75),
      hasValue: v !== null,
      isReady: v === null,
      markerX: String(C + R * Math.cos(rad(fm))),
      markerY: String(C + R * Math.sin(rad(fm))),
      markerColor: status === 'normal' ? GREEN : (status === 'high' ? HIGH : LOW),
      loX: (C + LR * Math.cos(rad(fLo))) + 'px', loY: (C + LR * Math.sin(rad(fLo))) + 'px',
      hiX: (C + LR * Math.cos(rad(fHi))) + 'px', hiY: (C + LR * Math.sin(rad(fHi))) + 'px',
      statusLabel: status ? { normal: 'Normal', high: 'Tachycardia', low: 'Bradycardia' }[status] : '',
      statusColor: status === 'normal' ? GREEN : (status === 'high' ? HIGH : LOW),
      valueText: v === null ? '--' : String(v),
      numberColor: v === null ? 'rgba(235,235,245,0.3)' : '#FFFFFF',
      count: String(count),
      countNoun: count === 1 ? 'beat' : 'beats'
    };
  }
}

return Component;
});
</script>
